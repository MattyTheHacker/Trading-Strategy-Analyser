# Both defaults are wrong for this repository, and CI enforces the corrected pair.
# `wrap = "no"` is the house style; `number = true` keeps ordered lists at 1./2./3.
# rather than flattening every item to 1.
number = true
wrap = "no"

# `.claude/rules/*.md` are hard-wrapped where every other file is not, so formatting
# them would reflow every one; their `paths:` front matter is safe now that
# mdformat-frontmatter is pinned. The other three are the venv and the two submodules.
exclude = [
    ".claude/**",
    ".venv/**",
    "Trading-Docs/**",
    "ninjatrader-scripts/**",
]
