# actionlint ships a bundled metadata snapshot of popular actions, and its copy of
# actions/create-github-app-token is stale: it predates `client-id` and still marks
# `app-id` as required. The action's own action.yml says the opposite -- `client-id`
# is a valid input and `app-id` carries a deprecationMessage pointing at it -- so
# these two errors are false positives, and "fixing" them would move the workflows
# back onto the deprecated input.
#
# The patterns deliberately stop before the version ref so they keep matching when
# Dependabot bumps the action. Re-check whether these are still needed if actionlint
# refreshes its snapshot.
paths:
  .github/workflows/**/*.yaml:
    ignore:
      - 'input "client-id" is not defined in action "actions/create-github-app-token'
      - 'missing input "app-id" which is required by action "actions/create-github-app-token'
  .github/workflows/**/*.yml:
    ignore:
      - 'input "client-id" is not defined in action "actions/create-github-app-token'
      - 'missing input "app-id" which is required by action "actions/create-github-app-token'
