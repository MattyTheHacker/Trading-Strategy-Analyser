name: "Automatically remove ready to merge label from PRs when they are closed"

on:
  pull_request:
    types:
      - closed

jobs:
  labeler:
    permissions:
      pull-requests: write

    runs-on: ubuntu-latest
    steps:
      - name: Remove ready to merge label after merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --remove-label "ready to merge" --repo "$PR_REPO"
