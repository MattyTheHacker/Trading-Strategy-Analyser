name: Checks, Linting and Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Outside the checkout, so `pymarkdown scan --recurse .` and the Codecov upload's file search
# never walk into it.
env:
  UV_PROJECT_ENVIRONMENT: /tmp/nqbt-venv

jobs:
  pytest:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # This is the functionality test but inaccurate coverage
          - name: Run test suite with pytest
            disable-jit: "0"
            codecov-flag: jit-enabled
            junit: true

          # This is the coverage test but inaccurate functionality 
          - name: Measure real coverage with numba JIT disabled
            disable-jit: "1"
            codecov-flag: jit-disabled
            junit: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pytest
        env:
          NUMBA_DISABLE_JIT: ${{ matrix.disable-jit }}
        run: uv run python -m pytest --cov=nqbt --cov-branch --cov-report=xml ${{ matrix.junit && '--junitxml=junit.xml' || '' }}

      - name: Upload test results to Codecov
        if: ${{ matrix.junit && !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          use_oidc: true

      - name: Upload coverage report to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: ${{ matrix.codecov-flag }}

  ruff:
    name: Lint and format Python using ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ruff check
        run: uv run ruff check --output-format=github nqbt formatting

      - name: Run ruff format
        run: uv run ruff format --output-format=github --check .

  mypy:
    name: Type-check Python using mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: uv sync --locked

      # The package and the formatter that rewrites it. tests/ and tools/ are not at zero yet.
      - name: Run mypy
        run: uv run mypy nqbt formatting

  pymarkdown:
    name: Lint Markdown files using PyMarkdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run PyMarkdown scan
        run: uv run pymarkdown scan --recurse .

      # The job name is a required status check in the ruleset, so it stays as it is
      # even though this step is not PyMarkdown. Exclusions live in .mdformat.toml.
      - name: Run mdformat check
        run: uv run mdformat --check .

  custom-format:
    name: Check custom code formatting rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run custom formatter check
        run: uv run python -m formatting.cli --check .
