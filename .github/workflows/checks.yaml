name: Checks, Linting and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    name: Lint code with Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check --output-format=github .

  mypy:
    name: Type-check code with mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy
        run: mypy .

  pytest:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # The compiled path. This is what actually verifies the fidelity-critical
          # @njit code, so its result is the one that gates a merge -- but see below
          # for why its coverage figure alone reads far too low.
          - name: Run test suite with pytest
            disable-jit: "0"
            codecov-flag: jit-enabled
            junit: true

          # coverage.py cannot see inside @njit-compiled functions -- numba runs machine
          # code, so every line in nqbt/sim/deadcat.py (and similarly indicators.py,
          # conditions.py) reads as missed even though it is exercised. This leg re-runs
          # the same suite with the JIT disabled purely to measure coverage correctly; it
          # must not replace the leg above. Codecov merges both uploads for the same
          # commit, so the PR comment reflects the union: real coverage, not the
          # compiled-path blind spot.
          - name: Measure real coverage with numba JIT disabled
            disable-jit: "1"
            codecov-flag: jit-disabled
            junit: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        env:
          NUMBA_DISABLE_JIT: ${{ matrix.disable-jit }}
        run: python -m pytest --cov=nqbt --cov-branch --cov-report=xml ${{ matrix.junit && '--junitxml=junit.xml' || '' }}

      - name: Upload test results to Codecov
        if: ${{ matrix.junit && !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          use_oidc: true

      - name: Upload coverage report to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: ${{ matrix.codecov-flag }}

  pymarkdown:
    name: Lint Markdown files using PyMarkdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymarkdownlnt

      - name: Run PyMarkdown scan
        run: pymarkdown scan --recurse .
