name: Checks, Linting and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    name: Lint code with Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check --output-format=github .

  mypy:
    name: Type-check code with mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run mypy
        run: mypy .

  pytest:
    name: Run test suite with pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest --cov=nqbt --cov-branch --cov-report=xml --junitxml=junit.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          use_oidc: true

      - name: Upload coverage report to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          flags: jit-enabled

  coverage:
    name: Measure real coverage with numba JIT disabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # coverage.py cannot see inside @njit-compiled functions -- numba runs machine code,
      # so every line in nqbt/sim/deadcat.py (and similarly indicators.py, conditions.py)
      # reads as missed even though it is exercised. This job re-runs the same suite with
      # the JIT disabled purely to measure coverage correctly; it must not replace the
      # job above, which is what actually verifies the compiled, fidelity-critical path.
      # Codecov merges both uploads for the same commit, so the PR comment reflects the
      # union: real coverage, not the compiled-path blind spot.
      - name: Run pytest with numba JIT disabled
        env:
          NUMBA_DISABLE_JIT: "1"
        run: python -m pytest --cov=nqbt --cov-branch --cov-report=xml

      - name: Upload coverage report to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          flags: jit-disabled

  pymarkdown:
      name: Lint Markdown files using PyMarkdown
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
  
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version-file: .python-version
            cache: 'pip'
            cache-dependency-path: pyproject.toml
  
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install pymarkdownlnt
  
        - name: Run PyMarkdown scan
          run: pymarkdown scan --recurse .
