name: Checks, Linting and Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # This is the functionality test but inaccurate coverage
          - name: Run test suite with pytest
            disable-jit: "0"
            codecov-flag: jit-enabled
            junit: true

          # This is the coverage test but inaccurate functionality 
          - name: Measure real coverage with numba JIT disabled
            disable-jit: "1"
            codecov-flag: jit-disabled
            junit: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        env:
          NUMBA_DISABLE_JIT: ${{ matrix.disable-jit }}
        run: python -m pytest --cov=nqbt --cov-branch --cov-report=xml ${{ matrix.junit && '--junitxml=junit.xml' || '' }}

      - name: Upload test results to Codecov
        if: ${{ matrix.junit && !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          use_oidc: true

      - name: Upload coverage report to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: ${{ matrix.codecov-flag }}

  ruff:
    name: Lint and format Python using ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff check
        run: ruff check --output-format=github nqbt

      - name: Run ruff format
        run: ruff format --output-format=github --check .

  mypy:
    name: Type-check Python using mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The package only. tests/ and tools/ are not at zero yet.
      - name: Run mypy
        run: mypy nqbt

  pymarkdown:
    name: Lint Markdown files using PyMarkdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run PyMarkdown scan
        run: pymarkdown scan --recurse .
