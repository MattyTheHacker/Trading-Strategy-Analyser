name: "Automatically remove next-up label from issues when they are closed"

on:
  issues:
    types:
      - closed

jobs:
  labeler:
    permissions:
      pull-requests: write

    runs-on: ubuntu-latest
    steps:
      - name: Remove next up label after merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_REPO: ${{ github.repository }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh issue edit "$PR_URL" --remove-label "next-up" --repo "$PR_REPO"
