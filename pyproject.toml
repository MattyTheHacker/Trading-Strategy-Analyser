[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "nqbt"
version = "0.1.0"
description = "Tier 1 strategy research and backtesting tool for NQ/MNQ futures"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3",
    "pandas>=3.0",
    "pyarrow>=25.0",
    "numba>=0.66",
    "TA-Lib>=0.7.1",
    "duckdb>=1.4",
    "joblib>=1.5",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[project.scripts]
nqbt = "nqbt.cli:main"

[tool.setuptools.packages.find]
include = ["nqbt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
