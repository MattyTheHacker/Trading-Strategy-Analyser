[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"


[project]
name = "nqbt"
version = "0.1.0"
description = "Tier 1 strategy research and backtesting tool for NQ/MNQ futures"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3",
    "pandas>=3.0",
    "pyarrow>=25.0",
    "numba>=0.66",
    "TA-Lib>=0.7.1",
    "duckdb>=1.4",
    "joblib>=1.5",
    "tzdata>=2025.2",
]


[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.5.260730",
    "pymarkdownlnt>=0.9.39",
]


[project.scripts]
nqbt = "nqbt.cli:main"


[tool.setuptools.packages.find]
include = ["nqbt*"]


[tool.setuptools.package-data]
nqbt = ["py.typed"]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.pymarkdown.extensions.front-matter]
enabled = true


[tool.pymarkdown.plugins.MD013]
enabled = false


[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
skip_covered = true
sort = "cover"


[tool.ruff]
line-length = 110
indent-width = 4
output-format = "concise"


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.ruff.lint]
extend-select = ["ALL"]
ignore = [
    # The formatter owns trailing commas, and ruff warns that the two disagree.
    "COM812",
    # The licence is stated once in LICENSE rather than at the top of every file.
    "CPY001",
    # D211 is the convention here: no blank line before a class docstring. Stated rather
    # than left to ruff, which picks one and warns.
    "D203",
    # A summary that asks a question ends in "?". D415 still requires terminal punctuation.
    "D400",
    # A dunder's contract is the language's; the ones that surprise carry a docstring anyway.
    "D105",
    # D212 is the convention here: a multi-line summary starts on the first line.
    "D213",
    # A docstring here says *what* a thing is -- CONTRIBUTING.md, "Where reasoning goes" --
    # which is a noun phrase, where D401 wants an imperative verb.
    "D401",
]


[tool.ruff.lint.pylint]
# An entry point taking one keyword per choice its caller must state is the shape of this
# codebase, not a defect. What is left above eleven is the parameter blobs #59 fixes.
max-args = 10


[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# The jitted loops: numba compiles from the call and has no keyword-only arguments, so a
# toggle is a positional boolean and its callers pass it as one.
"nqbt/sim/bracket.py" = ["FBT001", "FBT003"]
"nqbt/sim/crossover.py" = ["FBT001", "FBT003"]
"nqbt/sim/deadcat.py" = ["FBT001", "FBT003"]
"nqbt/sim/runner.py" = ["FBT003"]
# Each subcommand imports what it needs when it runs, so ``nqbt --help`` does not pay for
# numba, pandas and TA-Lib.
"nqbt/cli.py" = ["PLC0415"]


[tool.mypy]
check_untyped_defs = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "narrowed-type-not-subtype",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable"
]
extra_checks = true
mypy_path = "stubs"
no_implicit_reexport = true
strict_bytes = true
strict_equality = true
strict_equality_for_none = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
warn_incomplete_stub = true
