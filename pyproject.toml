[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"


[project]
name = "nqbt"
version = "0.1.0"
description = "Tier 1 strategy research and backtesting tool for NQ/MNQ futures"
requires-python = ">=3.14"
# Pinned exactly, not floored. CI resolves a fresh environment on every run, so a range
# means a release nobody chose can turn `main` red -- which it did, when numpy 2.5 changed a
# default that `>=` had let in. Dependabot raises the bumps; see CONTRIBUTING.md.
dependencies = [
    "numpy==2.5.2",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "numba==0.67.0",
    "TA-Lib==0.7.1",
    "duckdb==1.5.5",
    "joblib==1.5.3",
    "tzdata==2026.3",
]


[project.optional-dependencies]
# Pinned for the same reason, and ruff most of all: `extend-select = ["ALL"]` means a
# release that adds a rule fails a build nobody touched.
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
    "mypy==2.3.1",
    "pandas-stubs==3.0.5.260730",
    "pymarkdownlnt==0.9.39",
    "mdformat==1.0.0",
    "mdformat-gfm==1.0.0",
]


[project.scripts]
nqbt = "nqbt.cli:main"


[tool.setuptools.packages.find]
include = ["nqbt*"]


[tool.setuptools.package-data]
nqbt = ["py.typed"]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.pymarkdown.extensions.front-matter]
enabled = true


[tool.pymarkdown.plugins.MD013]
enabled = false


# The default, one_or_ordered, accepts both 1./2./3. and 1./1./1., so it cannot
# tell a bare mdformat run from a configured one. This is what catches it.
[tool.pymarkdown.plugins.MD029]
style = "ordered"


[tool.coverage.report]
# An import-time-only block: never executed, so never coverable.
exclude_also = ["if TYPE_CHECKING:"]
skip_covered = true
sort = "cover"


[tool.ruff]
line-length = 110
indent-width = 4
output-format = "concise"


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.ruff.lint]
extend-select = ["ALL"]
ignore = [
    # The formatter owns trailing commas, and ruff warns that the two disagree.
    "COM812",
    # The licence is stated once in LICENSE rather than at the top of every file.
    "CPY001",
    # D211 is the convention here: no blank line before a class docstring. Stated rather
    # than left to ruff, which picks one and warns.
    "D203",
    # A summary that asks a question ends in "?". D415 still requires terminal punctuation.
    "D400",
    # A dunder's contract is the language's; the ones that surprise carry a docstring anyway.
    "D105",
    # D212 is the convention here: a multi-line summary starts on the first line.
    "D213",
    # A docstring here says *what* a thing is -- CONTRIBUTING.md, "Where reasoning goes" --
    # which is a noun phrase, where D401 wants an imperative verb.
    "D401",
]


[tool.ruff.lint.pylint]
# An entry point taking one keyword per choice its caller must state is the shape of this
# codebase, not a defect. Nothing sits above ten any more: #59 grouped the jitted loops'
# scalars into the NamedTuple blobs in ``nqbt/sim/bracket.py``.
max-args = 10


[tool.ruff.lint.per-file-ignores]
# `assert` is how a test states its expectation; S101 is aimed at production code.
"tests/**" = ["S101"]
# The jitted loops: numba compiles from the call and has no keyword-only arguments, so a
# toggle is a positional boolean, and the archetypes pass one into a blob's constructor.
"nqbt/conditions.py" = ["FBT001", "FBT003"]
"nqbt/sim/bracket.py" = ["FBT001"]
"nqbt/sim/crossover.py" = ["FBT003"]
"nqbt/sim/deadcat.py" = ["FBT003"]
"nqbt/sim/elasticband.py" = ["FBT003"]
"nqbt/sim/insidebar.py" = ["FBT003"]
"nqbt/sim/insidebartrailing.py" = ["FBT003"]
# Each subcommand imports what it needs when it runs, so ``nqbt --help`` does not pay for
# numba, pandas and TA-Lib.
"nqbt/cli.py" = ["PLC0415"]


[tool.mypy]
check_untyped_defs = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "narrowed-type-not-subtype",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable"
]
extra_checks = true
no_implicit_reexport = true
strict_bytes = true
strict_equality = true
strict_equality_for_none = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
warn_incomplete_stub = true


[[tool.mypy.overrides]]
# joblib ships neither stubs nor a py.typed marker. Only Parallel, delayed and
# effective_n_jobs are used, all inside _sweep_parallel, so a stub under mypy_path would
# restate three signatures and gain nothing over letting the import be untyped.
module = ["joblib"]
ignore_missing_imports = true
