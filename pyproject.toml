[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"


[project]
name = "nqbt"
version = "0.1.0"
description = "Tier 1 strategy research and backtesting tool for NQ/MNQ futures"
requires-python = ">=3.14"
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "numba==0.68.0",
    "duckdb==1.5.6",
    "joblib==1.6.0",
    "tzdata==2026.5",
]


[project.scripts]
nqbt = "nqbt.cli:main"


[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "TA-Lib==0.8.1",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pandas-stubs==3.0.5.260914",
    "pymarkdownlnt==0.9.40",
    "mdformat-gfm==1.0.0",
    "mdformat-frontmatter==2.1.2",
    "libcst==1.9.0",
]


# A floor rather than a pin: Dependabot locks with its own, newer uv and stops on a mismatch.
# CI runs the exact version named by SETUP_UV_VERSION in .github/workflows/.
[tool.uv]
required-version = ">=0.11.14"


[tool.setuptools.packages.find]
include = ["nqbt*"]


[tool.setuptools.package-data]
nqbt = ["py.typed"]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.pymarkdown.extensions.front-matter]
enabled = true


[tool.pymarkdown.plugins.MD013]
enabled = false


# The default, one_or_ordered, accepts both 1./2./3. and 1./1./1., so it cannot
# tell a bare mdformat run from a configured one. This is what catches it.
[tool.pymarkdown.plugins.MD029]
style = "ordered"


# docs/findings/ files carry a front-matter `title` for tools/findings_index.py and an H1
# holding the campaign's original heading verbatim, because that heading is what existing
# `§ "..."` pointers name. The default, "title", would read the metadata field as the
# document's title and then report the H1 as a second one. No front-matter field here is the
# title, so this names one that does not exist -- an empty string is ignored.
[tool.pymarkdown.plugins.MD025]
front_matter_title = "no-front-matter-title"


[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
skip_covered = true
sort = "cover"


[tool.ruff]
line-length = 110
indent-width = 4
output-format = "concise"


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.ruff.lint]
extend-select = ["ALL"]
ignore = [
    "COM812",  # The formatter owns trailing commas, and ruff warns that the two disagree.
    "CPY001",  # The licence is stated once in LICENSE rather than at the top of every file.
    "D203",  # D211 is the convention here: no blank line before a class docstring. Stated rather than left to ruff, which picks one and warns.
    "D400",  # A summary that asks a question ends in "?". D415 still requires terminal punctuation.
    "D105",  # A dunder's contract is the language's; the ones that surprise carry a docstring anyway.
    "D213",  # D212 is the convention here: a multi-line summary starts on the first line.
]


[tool.ruff.lint.pylint]
# An entry point taking one keyword per choice its caller must state is the shape of this
# codebase, not a defect. Nothing sits above ten any more: #59 grouped the jitted loops'
# scalars into the NamedTuple blobs in ``nqbt/sim/bracket.py``.
max-args = 10


[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # `assert` is how a test states its expectation; S101 is aimed at production code.
    "D103",  # A test is named after the claim it makes (CONTRIBUTING.md, "Tests"), and a helper beside it after what it builds, so a docstring would repeat either.
    "PLR2004",  # A literal expected value is what an assertion compares against.
]
# The jitted loops: numba compiles from the call and has no keyword-only arguments, so a toggle is a positional boolean, and the archetypes pass one into a blob's constructor.
"nqbt/conditions.py" = ["FBT001", "FBT003"]
"nqbt/sim/bracket.py" = ["FBT001"]
"nqbt/sim/crossover.py" = ["FBT003"]
"nqbt/sim/deadcat.py" = ["FBT003"]
"nqbt/sim/elasticband.py" = ["FBT003"]
"nqbt/sim/emapullback.py" = ["FBT003"]
"nqbt/sim/insidebar.py" = ["FBT003"]
"nqbt/sim/insidebartrailing.py" = ["FBT003"]
"nqbt/sim/openingrange.py" = ["FBT003"]
# Each subcommand imports what it needs when it runs, so ``nqbt --help`` does not pay for
# numba and pandas.
"nqbt/cli.py" = ["PLC0415"]
"tests/test_chart.py" = ["S314"]  # It parses the SVGs nqbt.chart writes, not untrusted input.
# Tests that call a private helper directly, because that helper's own behaviour is the claim under test.
"tests/test_cli.py" = ["SLF001"]  # Each subcommand's handler is called with a parsed namespace, without going through argparse.
"tests/test_confluence_sizing.py" = ["SLF001"]  # The sizing rule `departs_from_port` holds is the rule under test.
"tests/test_openingrange_sim.py" = ["SLF001"]  # The window close is the reference for the drawn ranges, and the range-key refusal is the behaviour under test.
"tests/test_randomentry.py" = ["SLF001"]  # Placing an observation among its draws is arithmetic tested on its own.
"tests/test_restamp_tier2.py" = ["SLF001"]  # The reason a row leaves its port is the path under test.
"tests/test_splice.py" = ["SLF001"]  # The roll-order refusal is the behaviour under test.
"tests/test_squeeze_sim.py" = ["SLF001"]  # The range-key refusal is the behaviour under test.
"formatting/**" = ["T201", "D102", "D103"]


[tool.mypy]
# joblib ships neither stubs nor a py.typed marker; `stubs/joblib` is the hand-written surface.
mypy_path = "stubs"
check_untyped_defs = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "narrowed-type-not-subtype",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable"
]
extra_checks = true
no_implicit_reexport = true
strict_bytes = true
strict_equality = true
strict_equality_for_none = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
warn_incomplete_stub = true
